<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with Tavi</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #chat-container { width: 100%; max-width: 600px; height: 80vh; background: #1e1e1e; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 20px; max-width: 80%; word-wrap: break-word; }
        .user { align-self: flex-end; background-color: #007bff; color: white; }
        .bot { align-self: flex-start; background-color: #333; color: white; }
        #input-area { display: flex; padding: 15px; background: #222; border-top: 1px solid #333; }
        #chat-input { flex: 1; padding: 12px; border-radius: 20px; border: none; background: #333; color: white; outline: none; font-size: 16px; }
        #send-btn { margin-left: 10px; padding: 10px 20px; border: none; border-radius: 20px; background: #007bff; color: white; cursor: pointer; font-size: 16px; }
        #send-btn:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="messages">
            <div class="msg bot">Hi! I'm Tavi.</div>
        </div>
        <div id="input-area">
            <input type="text" id="chat-input" placeholder="Say something..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        const input = document.getElementById("chat-input");
        const btn = document.getElementById("send-btn");
        const msgs = document.getElementById("messages");

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;
            
            // Add user message
            const uMsg = document.createElement("div");
            uMsg.className = "msg user";
            uMsg.textContent = text;
            msgs.appendChild(uMsg);
            input.value = "";
            msgs.scrollTop = msgs.scrollHeight;

            // Call API
            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text })
                });
                const data = await res.json();
                
                // Add bot message
                const bMsg = document.createElement("div");
                bMsg.className = "msg bot";
                bMsg.textContent = data.response;
                msgs.appendChild(bMsg);
                msgs.scrollTop = msgs.scrollHeight;
            } catch (err) {
                console.error(err);
            }
        }

        btn.addEventListener("click", sendMessage);
        input.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });
    </script>
</body>
</html>
